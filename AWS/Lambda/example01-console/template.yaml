AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    # Tag standard (vedi AWS/README.md#convenzione-dei-tag), propagati anche al ruolo IAM generato da SAM
    PropagateTags: true
    Tags:
      Name: "aws-j-Lambda.example01-console"
      Environment: "dev"
      Project: "Development.aws.j-Lambda.example01-console"
      Owner: "AlNao"
      CostCenter: "dev"
      ManagedBy: "Sh"

Resources:
  # See https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
  # for more info to see how to tune the lambda function configs based on your use case.
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: java8
      Handler: it.alnao.App::handleRequest
      Timeout: 60
      MemorySize: 512
      CodeUri: ./target/example01-console.jar
      # Attach policies here to give the function permission to access other AWS resources if needed
      # See: https://github.com/awslabs/serverless-application-model/blob/master/docs/policy_templates.rst
      # eg:
      #Policies:
      # - S3ReadPolicy:
      #     BucketName: test-bucket