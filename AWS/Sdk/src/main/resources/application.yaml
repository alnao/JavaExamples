server:
  port: 8042

aws:
    # credenziali dal .env nella root del repository (set -a; source ../../.env; set +a)
    accessKey: ${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
    secretKey: ${AWS_SECRET_ACCESS_KEY:${AWS_SECRET_KEY:}}
    region: ${AWS_REGION:eu-central-1}
    profile: ${AWS_PROFILE:}
    

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      show-details: "always"