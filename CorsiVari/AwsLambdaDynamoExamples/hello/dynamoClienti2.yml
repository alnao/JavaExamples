---
AWSTemplateFormatVersion: '2010-09-09'
Description: Creazione Tabella DynamoDb Clienti

Resources:

  ClientiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: clienti2
      # Tag standard (vedi AWS/README.md#convenzione-dei-tag)
      Tags:
        - Key: Name
          Value: "aws-j-CorsiVari.AwsLambdaDynamoExamples.hello"
        - Key: Environment
          Value: "dev"
        - Key: Project
          Value: "Development.aws.j-CorsiVari.AwsLambdaDynamoExamples.hello"
        - Key: Owner
          Value: "AlNao"
        - Key: CostCenter
          Value: "dev"
        - Key: ManagedBy
          Value: "CloudFormation"
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      KeySchema:
        -
          AttributeName: userId
          KeyType: HASH
      AttributeDefinitions:
        -
          AttributeName: userId
          AttributeType: S

#aws cloudformation create-stack --stack-name DynamoDbClienti  --template-body file://dynamoClienti2.yml --capabilities CAPABILITY_NAMED_IAM 